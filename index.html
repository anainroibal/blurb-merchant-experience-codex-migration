<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blurb — Merchant Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <!-- Blurb's own Typekit kit — futura-pt and proxima-nova. Domain-locked,
         so it may not resolve off blurb.com; tokens.js carries fallbacks. -->
    <link rel="stylesheet" href="https://use.typekit.net/arj3syy.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1e1e1e;
        background: #fff;
        -webkit-font-smoothing: antialiased;
      }
      button { font-family: inherit; cursor: pointer; }
      input, select { font-family: inherit; }

      /* The steppers supply their own controls — the browser's native
         spinners would sit inside the Codex selector and duplicate them. */
      input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

      /* ── Motion ──
         One easing and two durations for the whole prototype, so nothing
         snaps. Colour, border and shadow are safe to transition everywhere;
         layout properties are not, so they are left out deliberately.

         --ease is a gentle deceleration: quick to start, settling at the
         end, which reads as responsive rather than sluggish. */
      :root {
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        --fast: 140ms;   /* hover, focus — must not lag the pointer */
        --slow: 260ms;   /* menus, panels, anything that appears */
        /* ── The nav's own motion, from blurb.com ──
           assets.blurb.com/_astro/index.CV0oYoXR.css:
             .nav__link-desktop   transition-duration .2s
             site-wide default    .15s
             timing function      cubic-bezier(.4, 0, .2, 1)

           So --nav-ease and --nav-hover below ARE the site's numbers.

           --menu is NOT. The live panel has no transition at all — it is
           display:none when collapsed, so it snaps in and out, and there
           is nothing there to copy. 420ms is ours, chosen because a panel
           this size opening on hover needs to read as a reveal; 260ms was
           the snap you saw. It uses the site's easing so it still feels
           like the site. */
        --nav-ease: cubic-bezier(0.4, 0, 0.2, 1);
        --nav-hover: 200ms;
        --menu: 420ms;
      }

      a, button, input, select, summary {
        transition:
          background-color var(--fast) var(--ease),
          border-color     var(--fast) var(--ease),
          color            var(--fast) var(--ease),
          box-shadow       var(--fast) var(--ease),
          opacity          var(--fast) var(--ease),
          transform        var(--fast) var(--ease);
      }

      /* Selecting a card is a bigger visual move than a hover, so it gets
         the slower duration and carries its ring and lift with it. */
      .card-move {
        transition:
          background-color var(--slow) var(--ease),
          border-color     var(--slow) var(--ease),
          color            var(--slow) var(--ease),
          box-shadow       var(--slow) var(--ease),
          transform        var(--slow) var(--ease);
      }

      /* Menus and popovers: fade up from just below their trigger. */
      .pop-in {
        animation: pop-in var(--slow) var(--ease) both;
        transform-origin: top center;
      }
      @keyframes pop-in {
        from { opacity: 0; transform: translateY(-6px) scale(0.985); }
        to   { opacity: 1; transform: none; }
      }

      /* A tray sliding in from the right edge. Same easing as everything
         else; the distance is short on purpose, because a long slide reads
         as slow rather than smooth. */
      .tray-in { animation: tray-in var(--menu, 420ms) var(--ease) both; }
      @keyframes tray-in {
        from { opacity: 0; transform: translateX(24px); }
        to   { opacity: 1; transform: none; }
      }

      /* Switching screen, and any section that arrives after a choice. */
      .fade-in { animation: fade-in var(--slow) var(--ease) both; }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: none; }
      }

      /* The rotating chevrons on every disclosure. */
      .turn { transition: transform var(--slow) var(--ease); }

      /* ── Responsive ──
         Everything in this prototype is styled with inline style objects,
         and an inline style beats any stylesheet rule. So every override
         below carries !important. That is confined to this block on
         purpose — it is the seam between the two systems, not a habit.

         Three sizes: desk (default), tablet at 1024, phone at 640. The
         nav collapses at 900 because that is where six top-level items
         plus the right-hand cluster stop fitting, not at a round number. */

      .nav-toggle, .nav-mobile { display: none; }

      @media (max-width: 1024px) {
        /* Steps and calculator stop being side by side. The calculator
           moves ABOVE the steps and pins to the top, so the price still
           moves while you choose — which is the whole reason it is not a
           block at the bottom of the page. */
        .cfg-grid { grid-template-columns: 1fr !important; gap: 24px !important; }
        .cfg-aside {
          order: -1;
          top: 8px !important;
          max-height: 40vh; overflow-y: auto;
          box-shadow: 0 8px 22px rgba(0, 0, 0, .09);
        }
        .cfg-steps { gap: 40px !important; }
      }

      @media (max-width: 900px) {
        .nav-desktop { display: none !important; }
        .nav-toggle { display: inline-flex; }
        .nav-mobile { display: block; }
        /* Panels that put copy beside a button: button drops below. */
        .stack-md { grid-template-columns: 1fr !important; }
      }

      @media (max-width: 640px) {
        /* The type scale in tokens.js is in rem, so it hangs off the root
           font size. Shrinking that once takes the whole scale down
           together and keeps every ratio in the design intact — far safer
           than overriding sizes one component at a time. */
        html { font-size: 15px; }
        .hide-sm { display: none !important; }
        .pop-wide {
          min-width: 0 !important;
          width: calc(100vw - 24px) !important;
          max-width: calc(100vw - 24px) !important;
        }
        .pop-cols { grid-template-columns: 1fr !important; }
        .cfg-aside { max-height: 34vh; padding: 16px !important; }
        .demo-bar { justify-content: center !important; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
          scroll-behavior: auto !important;
        }
      }
      .ms {
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
